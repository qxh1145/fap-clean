# Tự đóng gói FAP-Clean.zip và đính kèm vào release.
#
# Cách phát hành bản mới:
#   1. Tăng "version" trong manifest.json (ví dụ 1.0.1), commit và push lên main.
#   2. Trên GitHub: Releases → Draft a new release → tag v1.0.1 → Publish release.
#   Workflow này chạy khi release được publish: kiểm tra version khớp tag,
#   đóng gói, đính kèm FAP-Clean.zip và điền ghi chú phát hành.
#
# Có thể chạy lại tay cho một release đã có: Actions → Release → Run workflow.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag của release cần đóng gói lại (ví dụ v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Kiểm tra version khớp tag
        run: |
          manifest_version=$(jq -r .version manifest.json)
          if [ "$manifest_version" != "${TAG#v}" ]; then
            echo "::error::manifest.json là $manifest_version nhưng tag là $TAG. Sửa version rồi tạo lại release."
            exit 1
          fi

      - name: Kiểm tra cú pháp
        run: |
          node --check src/content.js
          node --check popup/popup.js
          jq empty manifest.json _locales/vi/messages.json

      - name: Đóng gói FAP-Clean.zip
        run: |
          mkdir -p dist/FAP-Clean
          cp -r manifest.json _locales fonts icons popup src styles PRIVACY.md dist/FAP-Clean/
          cp docs/HUONG-DAN-CAI.txt dist/FAP-Clean/HUONG-DAN-CAI.txt
          cd dist
          zip -r -X FAP-Clean.zip FAP-Clean
          unzip -l FAP-Clean.zip

      - name: Đính kèm vào release và điền ghi chú
        run: |
          sed "s/{{VERSION}}/${TAG}/g" .github/release-notes.md > dist/notes.md
          gh release upload "$TAG" dist/FAP-Clean.zip --clobber
          gh release edit "$TAG" --title "FAP Clean ${TAG}" --notes-file dist/notes.md
