# Đóng gói và phát hành khi đẩy tag dạng v1.2.3
#   git tag v1.0.1 && git push origin v1.0.1
# Version trong manifest.json phải khớp với tag.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kiểm tra version khớp tag
        run: |
          manifest_version=$(jq -r .version manifest.json)
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$manifest_version" != "$tag_version" ]; then
            echo "::error::manifest.json là $manifest_version nhưng tag là $tag_version"
            exit 1
          fi

      - name: Kiểm tra cú pháp
        run: |
          node --check src/content.js
          node --check popup/popup.js
          jq empty manifest.json _locales/vi/messages.json

      - name: Đóng gói FAP-Clean.zip
        run: |
          mkdir -p dist/FAP-Clean
          cp -r manifest.json _locales fonts icons popup src styles PRIVACY.md dist/FAP-Clean/
          cp docs/HUONG-DAN-CAI.txt "dist/FAP-Clean/HUONG-DAN-CAI.txt"
          cd dist
          zip -r -X FAP-Clean.zip FAP-Clean
          unzip -l FAP-Clean.zip

      - name: Tạo release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed "s/{{VERSION}}/${GITHUB_REF_NAME}/g" .github/release-notes.md > dist/notes.md
          gh release create "$GITHUB_REF_NAME" dist/FAP-Clean.zip \
            --title "FAP Clean ${GITHUB_REF_NAME}" \
            --notes-file dist/notes.md
